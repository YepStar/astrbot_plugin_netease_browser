name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install playback dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check main.py web.py music
      - name: Check metadata and configuration
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import yaml
          metadata = yaml.safe_load(Path('metadata.yaml').read_text())
          assert metadata['name'] == 'astrbot_plugin_netease_browser'
          assert metadata['version'] == '1.4.0'
          assert metadata['repo'] == 'https://github.com/YepStar/astrbot_plugin_netease_browser'
          json.loads(Path('_conf_schema.json').read_text())
          PYCODE
      - name: Test framework-independent core
        run: python -m pytest tests/test_music.py tests/test_together.py tests/test_expression.py -q
